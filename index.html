<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4a2c14">
<meta name="apple-mobile-web-app-title" content="Parcerias">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>FJK · Parcerias</title>
<style>
/* Mesmo padrão do Gestão de Tratos (FJK), na cor marrom */
:root{--bg:#f7f5f1;--surface:#fff;--line:#e3ddd4;--fg:#11253d;--muted:#5d6b7a;--accent:#6d4321;--lima:#a9c41c;--chip:#f3ece2;
  --ok:#2e7d32;--err:#b3261e;--body:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html,body{overscroll-behavior-y:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4}
.topo{background:linear-gradient(135deg,#4a2c14 0%,#7a4e26 100%);color:#fff;border-radius:0 0 20px 20px;padding:6px max(16px,env(safe-area-inset-left,0px)) 6px max(16px,env(safe-area-inset-right,0px))}
.topoLinha{display:flex;align-items:center;gap:8px;min-height:66px}
.topoLogo{height:clamp(52px,15.5vw,80px);width:auto;flex:none}
.topoTxt{flex:1;min-width:0;position:relative;padding-left:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;align-self:stretch}
.topoTxt::before{content:'';position:absolute;left:0;top:16%;bottom:16%;width:2px;border-radius:2px;background:var(--lima);opacity:.85}
.topoTxt h1{margin:0;color:#fff;font-size:clamp(12px,3.6vw,19px);letter-spacing:.04em;font-weight:800;line-height:1.15;max-width:100%}
select{font-size:.95rem}
.row label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filebtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;border-radius:10px;border:2px dashed var(--accent);color:var(--accent);background:var(--chip);padding:12px;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.topoTxt .sub{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 6px;font-size:12.5px;margin-top:2px;color:#f3e3c8}
.nuvem{background:#fff;color:var(--accent);padding:0 6px;border-radius:99px;font-size:9.5px;line-height:1.5;font-weight:700;white-space:nowrap}
.nuvem.off{color:var(--err)}.nuvem.pend{color:#a86b00}
.topoLinha button{flex:none;border:0;background:none;color:#fff;font-size:1.6rem;line-height:1;padding:6px 4px;cursor:pointer}
.topoLinha .atualizarBtn{font-size:1.7rem}.atualizarBtn.girando{animation:girar .8s linear infinite}@keyframes girar{to{transform:rotate(360deg)}}
body.naInicio .voltarIni{display:none}
body:not(.naInicio) #btnMenuFJK{display:none!important}
body.naInicio .topoLinha{min-height:clamp(80px,24vw,130px)}body.naInicio .topoLogo{height:clamp(56px,16vw,96px)}
body.naInicio .topo{padding-top:14px;padding-bottom:14px}body.naInicio .topoTxt h1{font-size:clamp(14px,4.3vw,24px)}
.wrap{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
/* quadrados coloridos */
.tiles{background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(0,0,0,.07);padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tiles button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:112px;padding:10px 6px;border-radius:18px;border:0;background:var(--c);color:#fff;font:inherit;font-size:1.25rem;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer;line-height:1.15}
.tiles button.full{grid-column:1/-1}
.tiles .gIc{font-size:2.1rem;line-height:1}
.tiles small{font-size:.72rem;font-weight:700;opacity:.9;letter-spacing:.04em}
.barra{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--accent);color:#fff;font-size:.92rem;font-weight:700;border:0;width:100%;font-family:inherit;cursor:pointer}
.tela{background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(0,0,0,.07);padding:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.card h3{margin:0 0 10px;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-left:5px solid var(--lima);padding-left:8px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px}
input,select,textarea{width:100%;font:inherit;font-weight:600;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-width:0}
input:focus,select:focus{outline:3px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1;min-width:0}
.bt{display:block;width:100%;margin-top:14px;background:var(--accent);border:2px solid var(--accent);color:#fff;border-radius:10px;padding:14px;font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer}
.bt.sec{background:#fff;color:var(--accent)}.bt.sec:active{background:var(--accent);color:#fff}
.fat{font-size:.86rem}.fat tr.tot td{font-size:.95rem}.fat th,.fat td{padding-left:3px;padding-right:3px}.fat th{font-size:.62rem;letter-spacing:.02em}
.fat .icb[data-x]{display:inline-flex!important;vertical-align:middle}
#fMedio{display:none!important}
.pgH{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;font-size:.82rem;padding:2px 0 6px;white-space:nowrap}
.pgBt{display:flex;gap:8px;margin-top:8px}.pgBt .bt{margin:0;flex:1;padding:7px 4px;font-size:.92rem;white-space:nowrap}.pgBt .bt.verde{color:#fff}
.pgB{margin-top:10px;border:1px solid #eee3d6;border-radius:12px;padding:8px 8px;font-size:.92rem}.pgT{font-weight:800;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.pgL{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f1ebe3}.pgL:last-of-type{border-bottom:0}.pgI .mut{flex:1;font-size:.85rem}.pgI .icb{width:34px;height:34px;font-size:.85rem}
.expRow .bt{font-size:.95rem;padding:9px 4px}
.arqCaixa{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.arqBox{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}.arqTit{display:flex;flex-direction:column;gap:4px}.arqTit small{color:var(--muted)}
.arqBox button{padding:12px;border-radius:10px;border:2px solid var(--accent);background:#fff;color:var(--accent);font:inherit;font-weight:700}.arqBox button.primary{background:#2e7d32;border-color:#2e7d32;color:#fff}
.btRow{display:flex;gap:8px;margin-top:14px}.btRow .bt{margin:0;flex:1;padding:9px 6px;font-size:1rem;color:#fff}.btRow .bt[hidden]{display:none}
.bt.verde{background:#2e7d32;border-color:#2e7d32}.bt.verm{background:#c62828;border-color:#c62828}.bt.amar{background:#f2b705;border-color:#f2b705;color:#3a2a00!important}
.bt.sm{display:inline-block;width:auto;margin:0;padding:7px 12px;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:#fff;border-radius:12px;padding:5px 6px;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.kpi b{display:block;line-height:1.15;font-size:1.35rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}.kpi span{display:block;line-height:1.1;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:800;background:var(--chip);border-bottom:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--accent)}
.tag.M{background:#fdecea;color:var(--err)}.tag.S{background:#e3eefc;color:#1d5fb4}.tag.T{background:#efe5f6;color:#6a3596}.tag.E{background:#e6f4d7;color:var(--ok)}
.mut{color:var(--muted);font-size:.85rem}
.seg{display:flex;background:var(--chip);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:99px;font:inherit;font-size:.88rem;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.hint{background:#fff6e0;border-left:4px solid #e0a020;padding:10px 12px;border-radius:8px;font-size:.88rem;margin-top:12px}
.arr-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.arr-h h3{margin:0}
.foto{max-width:100%;border-radius:8px;margin-top:6px;max-height:180px;display:block}
.fotos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.fotos img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block}.fotos .fw{position:relative}.fotos .fx{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--err);color:#fff;font-weight:800;font-size:.8rem;line-height:22px;padding:0}
.brs input{margin-bottom:6px}
.list-it{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-it:last-child{border:0}
.clic{cursor:pointer;-webkit-tap-highlight-color:transparent}.clic:active{background:var(--chip)}
.linhas{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.linhas button{flex:1 1 auto;padding:8px 10px;font:inherit;font-size:.82rem;font-weight:700;white-space:nowrap;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--fg);cursor:pointer}
.linhas button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.filtroLbl{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 5px}
.acoes{display:flex;gap:6px;align-items:flex-start;flex:none}
.icb{width:40px;height:40px;padding:0;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:1.05rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icb.del{color:var(--err);font-weight:800}
.seta{font-size:1.8rem;color:var(--muted);align-self:center;padding:0 4px}
.scroll{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#fff;padding:14px 22px;border-radius:16px;font-weight:700;font-size:1.05rem;max-width:86vw;text-align:center;z-index:9999;box-shadow:0 8px 28px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
.pk{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9998;display:flex;align-items:flex-end}
.pk .pkBox{background:#fff;width:100%;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;padding:8px 14px 24px}
.pk .pkTop{position:sticky;top:-8px;z-index:2;background:#fff;display:flex;align-items:center;justify-content:space-between;margin:-8px -14px 4px;padding:10px 14px 8px;border-bottom:1px solid #eee}
.pk .pkT{font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pk .pkX{width:40px;height:40px;border-radius:10px;border:2px solid var(--accent);background:#fff;color:var(--accent);font-size:1.2rem;font-weight:800;cursor:pointer}
.pk .pkGrp{border:2px solid #e2d3bf;border-radius:14px;padding:2px 8px 6px;margin:10px 0;background:#fffdfa}.pk .pkGrp .pkG{border-top:0;padding-top:8px}
.pk .pkG{font-weight:800;color:var(--fg);font-size:1.05rem;padding:14px 4px 4px;border-top:1px solid #eee}.pk .pkG:first-child{border-top:0}
.pk .pkI{padding:10px 12px;margin:4px 0;border-radius:10px;background:#f5f2ee;cursor:pointer}.pk .pkI.on{background:var(--accent);color:#fff}.pk .pkI.on .mut{color:#f3e6d8}
.pk .pkI b{display:block}.pk .pkI .mut{font-size:.95rem}
.selW{position:relative}.selW select{pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9998;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:320px;text-align:center}
.pin{font-size:28px;letter-spacing:12px;margin:8px 0 12px;min-height:38px}
.tec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tec button{padding:16px;font-size:1.4rem;font-weight:700;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.gNavData{display:flex;align-items:stretch;gap:6px}
.gSeta{flex:0 0 46px;padding:0;font-size:1.1rem;background:var(--accent);color:#fff;border:2px solid var(--accent);border-radius:10px;cursor:pointer}
.gDataBox{flex:1;min-width:0;position:relative;margin:0;display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--line);border-radius:10px;min-height:48px;padding:0 6px;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--fg);font-size:1.05rem}
.gDataBox span{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gDataBox i{font-style:normal;font-size:.75rem;background:var(--lima);color:var(--fg);border-radius:99px;padding:1px 7px;margin-left:6px}
.gDataBox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;margin:0;min-height:0;cursor:pointer}
.card.fBox{background:none;border:0;box-shadow:none;padding:2px 0 6px;margin-bottom:8px}
.fBox h3{display:flex;justify-content:space-between;align-items:center}
.fLin{display:grid;grid-template-columns:84px 46px minmax(0,1fr) 46px;gap:6px;align-items:stretch;margin-top:8px}
.fLin .gDataBox{min-height:48px}
.fLbl{border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:2px}
.gSeta:disabled{opacity:.35;cursor:default}
.gDataBox select{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;margin:0;min-height:0;cursor:pointer;font-size:16px}
.gHoje{display:inline-block;margin-top:6px;border:0;border-radius:8px;background:#2e7d32;color:#fff;font:inherit;font-size:.8rem;font-weight:700;padding:4px 12px;cursor:pointer}
a{color:var(--accent)}
</style>
</head>

const PROPS0=['AP','FJK','JUNIOR-MURILO'];

  const L=[ // [arr, nome do lote, proprietário, saldo atual da planilha]
    ['A1','ADRIANO - MACHOS','AP',188],['A2','ISRAEL - MACHOS','AP',100],['A3','NOEL - MACHOS','AP',128],
    ['A4','WELLINGTON - MACHOS','AP',194],['A4','WELLINGTON - VACAS','AP',14],['A4','WELLINGTON - BEZERRAS','FJK',126],
    ['A5','IGOR - GAÚCHO','AP',10],['A5','IGOR - MARCILIO','AP',19],['A5','IGOR - KLEBER','AP',30],
    ['A6','FIRMINO - MACHOS','AP',330],['A6','FIRMINO - VACAS','FJK',150],['A6','FIRMINO - BEZERROS','FJK',2],
    ['A7','ORLANDO - MACHOS','FJK',693],['A8','JANIO - MACHOS','FJK',615],
    ['A9','LUIZ PORTO - MACHOS','JUNIOR-MURILO',78]];
  const lotes=L.map((l,i)=>({id:'L'+(i+1),arrId:l[0],nome:l[1],prop:l[2],valorCab:0,salario:0,ativo:true}));
  const movs=L.map((l,i)=>({id:'M'+(i+1),data:'2026-10-31',tipo:'ENTRADA',loteId:'L'+(i+1),qtd:l[3],sexo:'',peso:'',valor:'',brinco:'',foto:'',obs:'SALDO INICIAL (importado da planilha)'}));
  return {arr,lotes,movs,desp:[],pags:[],ajus:[],props:PROPS0.slice(),seq:100};
}
let DB;
try{DB=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!DB)DB=semente();if(!DB.pags)DB.pags=[];if(!DB.ajus)DB.ajus=[];
if(!DB.props)DB.props=PROPS0.slice();
const PROPS=new Proxy([], {get:(t,k)=>{const v=DB.props[k];return typeof v==='function'?v.bind(DB.props):v}});
function salvar(){try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}}
const nid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
/* ===================== SINCRONIZAÇÃO (off-line primeiro, envia quando tiver sinal) ===================== */
let FILA=[];try{FILA=JSON.parse(localStorage.getItem(LS+'_fila'))||[]}catch(e){}
const api=()=>{try{return localStorage.getItem(LS+'_url')||API_URL}catch(e){return API_URL}};
let enviando=false,online=null;
function salvarFila(){try{localStorage.setItem(LS+'_fila',JSON.stringify(FILA))}catch(e){}}
const APP_VERSAO='31';
function status(){const e=$('#st');if(!e)return;e.className='nuvem';e.hidden=false;
  const u=DB.ultSync?new Date(DB.ultSync):null;
  $('#hoje').textContent=(u?`Atualizado ${u.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} às ${u.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`:'Sem sincronizar')+' – v'+APP_VERSAO;
  if(!api()){e.textContent='Nuvem: não ligada';e.classList.add('off');return}
  if(FILA.length){e.textContent='Nuvem: '+FILA.length+' pendente(s)';e.classList.add('pend');return}
  if(online===false){e.textContent='Nuvem: sem sinal';e.classList.add('off');return}
  e.textContent='';e.hidden=true}
function put(t,reg){
  if(t==='props'){if(!DB.props.includes(reg.nome))DB.props.push(reg.nome)}
  else{reg.criadoEm=reg.criadoEm||new Date().toISOString();const i=DB[t].findIndex(x=>x.id===reg.id);if(i>=0)DB[t][i]=reg;else DB[t].push(reg)}
  FILA.push({acao:'salvar',tabela:t,reg:JSON.parse(JSON.stringify(reg))});salvar();salvarFila();enviar();
}
function del(t,id){DB[t]=DB[t].filter(x=>x.id!==id);FILA.push({acao:'excluir',tabela:t,id});salvar();salvarFila();enviar()}
async function enviar(){
  status();if(!api()||enviando||!FILA.length)return;enviando=true;
  try{while(FILA.length){const lote=FILA.slice(0,15);
    const r=await fetch(api(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({ops:lote})});
    const j=await r.json();if(!j.ok)throw new Error(j.erro||'erro');
    (j.resultados||[]).forEach(x=>{if(x&&x.tabela==='movs'&&x.reg){const m=DB.movs.find(y=>y.id===x.reg.id);if(m)m.foto=x.reg.foto}});
    FILA.splice(0,lote.length);DB.ultSync=Date.now();salvarFila();salvar();online=true;status()}
  }catch(e){online=false}
  enviando=false;status();
}
const NUM=['qtd','peso','valor','valorCab','salario','precoArroba','divArroba'];
const FAZ_PROPRIAS=['PARAÍSO','JK','JUREMA'];
const SUB_SAI=['VENDA','TRANSFERÊNCIA','ABATE / CONSUMO','OUTROS'],SUB_ENT=['COMPRA','TRANSFERÊNCIA DE FAZENDA PRÓPRIA','NASCIMENTO','OUTROS'];
function normal(reg){for(const k of ['data','pagoEm'])if(reg[k])reg[k]=ymd(reg[k]);for(const k in reg){if(NUM.includes(k)&&reg[k]!==''&&reg[k]!=null)reg[k]=+reg[k];if(k==='ativo')reg[k]=reg[k]===true||reg[k]==='true'}return reg}
async function carregar(){
  if(!api())return status();await enviar();if(FILA.length)return;
  try{const r=await fetch(api()+'?acao=tudo');const j=await r.json();if(!j.ok)throw 0;online=true;
    const d=j.dados;DB.planilha=j.planilha;DB.ultSync=Date.now();
    if(d.arr.length){DB.arr=d.arr.map(normal);DB.lotes=d.lotes.map(normal);DB.movs=d.movs.map(normal);DB.desp=d.desp.map(normal);DB.pags=(d.pags||[]).map(normal);DB.ajus=(d.ajus||[]).map(normal);
      if(d.props.length)DB.props=d.props.map(p=>p.nome);DB.servidorVazio=false}else DB.servidorVazio=true;
    salvar();go(TELA)}catch(e){online=false}
  status();
}
function enviarTudo(){DB.props.forEach(p=>FILA.push({acao:'salvar',tabela:'props',reg:{id:p,nome:p}}));
  ['arr','lotes','movs','desp','pags','ajus'].forEach(t=>(DB[t]||[]).forEach(reg=>FILA.push({acao:'salvar',tabela:t,reg})));
  DB.servidorVazio=false;salvarFila();salvar();enviar();toast(FILA.length+' registros na fila de envio')}

/* ===================== UTILITÁRIOS ===================== */
const $=s=>document.querySelector(s);
const ymd=v=>{if(!v)return'';v=String(v);if(/^\d{4}-\d\d-\d\d/.test(v))return v.slice(0,10);const x=new Date(v);if(isNaN(x))return'';return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const fmtD=iso=>{iso=ymd(iso);if(!iso)return'';const[a,m,d]=iso.split('-');return d+'/'+m+'/'+a};
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const R$=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const arrDe=id=>DB.arr.find(a=>a.id===id)||{};
const loteDe=id=>DB.lotes.find(l=>l.id===id)||{};
const CATS=['BEZERROS MACHOS','GARROTES','BOIS','BEZERRAS FÊMEAS','NOVILHAS','VACAS'];
const catLote=l=>{if(!l)return'';if(l.categoria)return String(l.categoria).toUpperCase();const n=(l.nome||'').toUpperCase();
  return /VACA/.test(n)?'VACAS':/BEZERRA/.test(n)?'BEZERRAS FÊMEAS':/BEZERRO/.test(n)?'BEZERROS MACHOS':/NOVILHA/.test(n)?'NOVILHAS':/GARROTE/.test(n)?'GARROTES':/\bBOI/.test(n)?'BOIS':''};
const sexoLote=l=>{const c=catLote(l);return c?(CATS.indexOf(c)>=3?'F':'M'):''};
const sufLote=l=>{const a=(arrDe(l.arrId).nome||'');let n=(l.nome||'').trim();if(a&&n.toUpperCase().startsWith(a.toUpperCase()))n=n.slice(a.length).replace(/^\s*-\s*/,'');return n};
const rotLote=(l,cab)=>{if(!l||!l.id)return'—';const c=catLote(l);let meio=c||sufLote(l)||'sem categoria';
  if(c&&DB.lotes.some(o=>o.id!==l.id&&o.arrId===l.arrId&&o.prop===l.prop&&catLote(o)===c)){const sf=sufLote(l),x=sf&&sf.toUpperCase()!==c?sf:(l.obs||'');if(x)meio+=` (${x})`}
  return `${arrDe(l.arrId).nome||'?'} - ${meio} - ${l.prop}`+(cab?` - ${saldo(l.id)} cab`:'')};
const nomeLote=id=>rotLote(loteDe(id));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
// efeito de cada movimento no saldo de um lote
function efeito(m,loteId){
  if(m.tipo==='ENTRADA'&&m.loteId===loteId)return +m.qtd;
  if((m.tipo==='SAIDA'||m.tipo==='MORTE')&&m.loteId===loteId)return -m.qtd;
  if(m.tipo==='TRANSF'){if(m.loteId===loteId)return -m.qtd;if(m.loteDest===loteId)return +m.qtd}
  return 0;
}
const saldo=(loteId,ate)=>DB.movs.filter(m=>!ate||m.data<=ate).reduce((s,m)=>s+efeito(m,loteId),0);
const optLote=(l,sel)=>`<option value="${l.id}" ${l.id===sel?'selected':''} data-p="${esc(l.prop+(l.obs?' - '+l.obs:''))}" data-c="${esc((catLote(l)||sufLote(l)||'sem categoria')+' - '+saldo(l.id)+' cab')}">${rotLote(l,1)}</option>`;
function esc(t){return String(t??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function optLotes(sel,soAtivos=true){
  return DB.arr.map(a=>{const ls=DB.lotes.filter(l=>l.arrId===a.id&&(!soAtivos||l.ativo));if(!ls.length)return'';
    return `<optgroup label="${a.nome} - ${a.cidade}">`+ls.map(l=>optLote(l,sel)).join('')+'</optgroup>'}).join('');
}

/* ===================== DATAS (padrão FJK: dd/mm/aaaa, comprido, ◀ ▶ e toque abre o calendário) ===================== */
const SEMN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],MESN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const somaDias=(k,n)=>{const[y,m,d]=k.split('-').map(Number);const x=new Date(y,m-1,d+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const somaMes=(k,n)=>{const[y,m]=k.split('-').map(Number);const x=new Date(y,m-1+n,1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
function rotDia(d){if(!d)return'Escolher';const[y,m,dd]=d.split('-').map(Number),hj=hoje();const tag=d===hj?'Hoje':d===somaDias(hj,-1)?'Ontem':d===somaDias(hj,1)?'Amanhã':'';
  return `${SEMN[new Date(y,m-1,dd).getDay()]} ${fmtD(d)}${tag?` <i>${tag}</i>`:''}`}
function rotMes(k){if(!k)return'Escolher';const[y,m]=k.split('-');return `${m}/${y}`}
function campoData(id,v){return `<div class="gNavData"><button type="button" class="gSeta" data-dn="-1" data-alvo="${id}" aria-label="Dia anterior">◀</button><label class="gDataBox"><span>${rotDia(v)}</span><input type="date" id="${id}" value="${v||''}"></label><button type="button" class="gSeta" data-dn="1" data-alvo="${id}" aria-label="Dia seguinte">▶</button></div><button type="button" class="gHoje" data-hoje="${id}" ${v===hoje()?'hidden':''}>Voltar para hoje</button>`}
function campoMes(id,v){return `<div class="gNavData"><button type="button" class="gSeta" data-mn="-1" data-alvo="${id}" aria-label="Mês anterior">◀</button><label class="gDataBox"><span>${rotMes(v)}</span><input type="month" id="${id}" value="${v||''}"></label><button type="button" class="gSeta" data-mn="1" data-alvo="${id}" aria-label="Mês seguinte">▶</button></div>`}
function filtroSel(id,lbl,ops,sel){const o=ops.map(([v,t])=>`<option value="${v}" ${String(v)===String(sel)?'selected':''}>${t}</option>`).join('');
  const t=(ops.find(([v])=>String(v)===String(sel))||ops[0]||['',''])[1];
  return `<div class="fLin"><div class="fLbl">${lbl}</div><button type="button" class="gSeta" data-fn="-1" data-alvo="${id}" aria-label="Anterior">◀</button><label class="gDataBox"><span>${t}</span><select id="${id}">${o}</select></label><button type="button" class="gSeta" data-fn="1" data-alvo="${id}" aria-label="Próximo">▶</button></div>`}
function filtroMes(id,lbl,v){return `<div class="fLin"><div class="fLbl">${lbl}</div><button type="button" class="gSeta" data-mn="-1" data-alvo="${id}" aria-label="Mês anterior">◀</button><label class="gDataBox"><span>${rotMes(v)}</span><input type="month" id="${id}" value="${v||''}"></label><button type="button" class="gSeta" data-mn="1" data-alvo="${id}" aria-label="Mês seguinte">▶</button></div>`}
function syncSel(sl){const sp=sl.closest('.gDataBox').querySelector('span');sp.textContent=sl.options[sl.selectedIndex]?sl.options[sl.selectedIndex].text:'';
  const lin=sl.closest('.fLin');if(lin){lin.querySelector('[data-fn="-1"]').disabled=sl.selectedIndex<=0;lin.querySelector('[data-fn="1"]').disabled=sl.selectedIndex>=sl.options.length-1}}
function syncSels(){document.querySelectorAll('.fLin select').forEach(syncSel)}
function syncData(i){const sp=i.closest('.gDataBox').querySelector('span');sp.innerHTML=i.type==='month'?rotMes(i.value):rotDia(i.value);
  const h=document.querySelector(`[data-hoje="${i.id}"]`);if(h)h.hidden=i.value===hoje()}
function mudaData(i,v){i.value=v;syncData(i);i.dispatchEvent(new Event('change',{bubbles:true}))}
document.addEventListener('click',e=>{const t=e.target;
  const inp=t.closest&&t.closest('.gDataBox input');if(inp&&inp.showPicker){try{inp.showPicker()}catch(_){}}
  const f=t.closest&&t.closest('[data-fn]');if(f){const sl=document.getElementById(f.dataset.alvo);const ni=sl.selectedIndex+(+f.dataset.fn);if(ni>=0&&ni<sl.options.length){sl.selectedIndex=ni;syncSel(sl);sl.dispatchEvent(new Event('change',{bubbles:true}))}return}
  const b=t.closest&&t.closest('[data-dn],[data-mn],[data-hoje]');if(!b)return;
  const i=document.getElementById(b.dataset.alvo||b.dataset.hoje);if(!i)return;
  if(b.dataset.hoje)mudaData(i,hoje());else if(b.dataset.dn)mudaData(i,somaDias(i.value||hoje(),+b.dataset.dn));else mudaData(i,somaMes(i.value||hoje().slice(0,7),+b.dataset.mn));});
document.addEventListener('change',e=>{const i=e.target;if(i.tagName==='SELECT'&&i.closest&&i.closest('.fLin'))syncSel(i);if(i.closest&&i.closest('.gDataBox')&&(i.type==='date'||i.type==='month'))syncData(i)},true);

/* ===================== ESTOQUE ===================== */
function estoque(){
  let fp='';
  const render=()=>{
    const porProp={};PROPS.forEach(p=>porProp[p]=0);
    let html='';
    DB.arr.forEach(a=>{
      const ls=DB.lotes.filter(l=>l.arrId===a.id&&l.ativo&&(!fp||l.prop===fp));if(!ls.length)return;
      let st=0;const rows=ls.map(l=>{const s=saldo(l.id);st+=s;porProp[l.prop]=(porProp[l.prop]||0)+s;
        return `<tr><td>${l.nome}</td><td><span class="tag">${l.prop}</span></td><td class="n"><b>${s}</b></td></tr>`}).join('');
      html+=`<div class="card"><div class="arr-h"><h3>${a.nome}</h3><span class="mut">${a.cidade}</span></div>
      <table>${rows}<tr class="tot"><td colspan="2">Total</td><td class="n">${st}</td></tr></table></div>`;
    });
    const tot=Object.values(porProp).reduce((a,b)=>a+b,0);
    $('#est').innerHTML=`<div class="card"><h3>Por proprietário</h3><table>${PROPS.map(p=>`<tr><td>${p}</td><td class="n"><b>${N(porProp[p])}</b></td></tr>`).join('')}<tr class="tot"><td>Total geral</td><td class="n">${N(tot)}</td></tr></table></div>`+html;
  };
  $('#cx').innerHTML=`<div class="seg" id="fp"><button class="on" data-p="">Todos</button>${PROPS.map(p=>`<button data-p="${p}">${p}</button>`).join('')}</div><div id="est" style="margin-top:10px"></div>`;
  $('#fp').onclick=e=>{if(!e.target.dataset)return;fp=e.target.dataset.p;[...$('#fp').children].forEach(b=>b.classList.toggle('on',b===e.target));render()};
  render();
}

    <div class="row"><div><label>Peso total (kg)</label><input type="number" inputmode="decimal" id="fPeso"></div>

function reduzFoto(f){if(!f)return;const r=new FileReader();r.onload=ev=>{const im=new Image();im.onload=()=>{if(FOTOS.length>=MAXF)return;const k=Math.min(1,800/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);FOTOS.push(c.toDataURL('image/jpeg',.7));mostraFotos()};im.src=ev.target.result};r.readAsDataURL(f)}
function mostraFotos(){const el=$('#fPrev');if(!el)return;el.innerHTML=FOTOS.map((f,i)=>`<div class="fw"><img src="${f}"><button type="button" class="fx" onclick="FOTOS.splice(${i},1);mostraFotos()">✕</button></div>`).join('');

function montaBrincos(ini){const box=$('#fBrs');if(!box)return;const atual=ini||[...box.querySelectorAll('input')].map(x=>x.value);

/* ===================== FATURAS DO MÊS ===================== */
/* Regra: valor/cab/mês ÷ 30 por dia.
   Animal que já estava no lote no início do mês = 30 dias (mês fechado).
   Entrou no dia D  → conta (último dia do mês − D) dias. Ex.: dia 10 → 20 dias (mês de 30) ou 21 (mês de 31).
   Saiu/morreu/transferiu no dia D → desconta (último dia − D) dias, ou seja, cobra até o dia da saída. */
function calcFatura(ym){
  const [Y,M]=ym.split('-').map(Number);const ult=new Date(Y,M,0).getDate();
  const ini=ym+'-01',fim=ym+'-'+String(ult).padStart(2,'0');
  const antes=new Date(Y,M-1,0);const diaAntes=antes.getFullYear()+'-'+String(antes.getMonth()+1).padStart(2,'0')+'-'+String(antes.getDate()).padStart(2,'0');
  return DB.lotes.map(l=>{
    const cabIni=saldo(l.id,diaAntes);let cd=cabIni*30,ent=0,sai=0;
    DB.movs.filter(m=>m.data>=ini&&m.data<=fim).forEach(m=>{const e=efeito(m,l.id);if(!e)return;const d=+m.data.slice(8);
      cd+=e*(ult-d);if(e>0)ent+=e;else sai+=-e});
    const cabFim=cabIni+ent-sai;const valor=cd*(l.valorCab||0)/30;
    return {l,cabIni,ent,sai,cabFim,cd,valor,salario:cd>0?(l.salario||0):0};
  }).filter(x=>x.cabIni||x.ent||x.sai);
}

  $('#cx').innerHTML=`<div class="card fBox">${filtroMes('fM','Mês',FAT.ym||ym0)}${filtroSel('fA','Parceiro',[['','Todos'],...DB.arr.filter(a=>a.ativo).map(a=>[a.id,a.nome])],FAT.arr||'')}</div><div id="fR"></div>
  <div class="hint"><b>Como calcula:</b> valor por cabeça ÷ 30 × dias. Mês fechado = 30 dias. Entrou dia 10 → 20 dias (mês de 30) ou 21 (mês de 31). Saída, morte e transferência cobram até o dia em que saiu.</div>`;
  const r=()=>{const ym=$('#fM').value;if(!ym)return;const fa=$('#fA').value;FAT.ym=ym;FAT.arr=fa;
    if(quitado(ym)){$('#fR').innerHTML='<div class="card mut" style="text-align:center">Até 11/2026 está tudo quitado (lançado na planilha anterior).<br>As faturas começam em <b>12/2026</b>.</div>';return}const F=calcFatura(ym);let html='',tg=0,ts=0;
    DB.arr.filter(a=>!fa||a.id===fa).forEach(a=>{const fs=F.filter(x=>x.l.arrId===a.id);if(!fs.length)return;let ta=0,sa=0;
      const rows=fs.map(x=>{ta+=x.valor;sa+=x.salario;return `<tr><td>${catLote(x.l)||x.l.nome}<br><span class="mut">${x.l.prop} · ${R$(x.l.valorCab)}/cab</span></td><td class="n">${x.cabIni}</td><td class="n">${x.ent?'+'+x.ent:''}${x.sai?' −'+x.sai:''}</td><td class="n">${N(x.cd/30)}</td><td class="n"><b>${R$(x.valor)}</b></td></tr>`}).join('');
      const taC=ta,saC=sa,ajP=ajDe(a.id,ym,'P'),ajS=ajDe(a.id,ym,'S');if(ajP)ta=+ajP.valor;if(ajS)sa=+ajS.valor;
      tg+=ta;ts+=sa;

      </table></div>${pagBloco(a,ym,ta,sa,taC,saC,ajP,ajS)}</div>`});
    $('#fR').innerHTML=(html||'<div class="card mut">Nenhum animal no mês.</div>')+`<div class="card"><table><tr><td>Aluguéis</td><td class="n">${R$(tg)}</td></tr><tr><td>Salários</td><td class="n">${R$(ts)}</td></tr><tr class="tot"><td>Total do mês</td><td class="n">${R$(tg+ts)}</td></tr>${(()=>{const pp=DB.pags.filter(p=>p.ref===ym&&(!fa||p.arrId===fa)),q=quitado(ym),pg=q?r2(tg):somaP(pp.filter(p=>!ehSal(p))),sg=q?r2(ts):somaP(pp.filter(ehSal));return `<tr><td>Aluguéis pagos</td><td class="n" style="color:var(--ok)">${R$(pg)}</td></tr><tr><td><b>Aluguéis à pagar</b></td><td class="n" style="color:var(--err)"><b>${R$(Math.max(r2(tg)-pg,0))}</b></td></tr>${ts?`<tr><td>Salários pagos</td><td class="n" style="color:var(--ok)">${R$(sg)}</td></tr><tr><td><b>Salários à pagar</b></td><td class="n" style="color:var(--err)"><b>${R$(Math.max(r2(ts)-sg,0))}</b></td></tr>`:''}`})()}</table></div>`};
  $('#fM').onchange=r;$('#fA').onchange=r;r();
}
const r2=v=>Math.round((+v||0)*100)/100;
const ehSal=p=>String(p.id).startsWith('PS_');const somaP=ps=>r2(ps.reduce((s,p)=>s+(+p.valor||0),0));
const pagosDe=(arrId,ym,tp)=>DB.pags.filter(p=>p.arrId===arrId&&p.ref===ym&&(!tp||(tp==='S')===ehSal(p)));
const INI_PAG='2026-12';const quitado=ym=>ym<INI_PAG;
function pagBloco(a,ym,ta,sa,taC,saC,ajP,ajS){
  const bloco=(nome,tot,tp,calc,aj)=>{if(quitado(ym))return `<div class="pgB"><div class="pgH"><span>${nome} - <b style="color:var(--ok)">QUITADO</b></span><b style="color:var(--ok)">${R$(tot)}</b></div></div>`;const ps=pagosDe(a.id,ym,tp),pg=somaP(ps),pend=r2(r2(tot)-pg);
    return `<div class="pgB"><div class="pgH"><span>${nome} - <b style="color:${pend>0.004?'var(--err)':'var(--ok)'}">${pend>0.004?'À PAGAR':'PAGO'}</b></span><b style="color:${pend>0.004?'var(--err)':'var(--ok)'}">${R$(pend>0.004?pend:pg)}</b></div>
    ${ps.map(p=>`<div class="pgL pgI"><span class="mut">${fmtD(p.data)} · ${esc(p.conta||'')}${p.obs?' · '+esc(p.obs):''}</span><b>${R$(p.valor)}</b><button class="icb" onclick="editPag('${p.id}')">✏️</button><button class="icb" onclick="delPag('${p.id}')">✕</button></div>`).join('')}
    ${pg&&pend>0.004?`<div class="pgL"><span class="mut">Pago</span><b style="color:var(--ok)">${R$(pg)}</b></div>`:''}
    <div class="pgBt"><button class="bt sec" onclick="ajustarValor('${a.id}','${ym}','${tp}',${r2(calc)})">✏️ Editar${aj?' <small style="font-size:.72rem">(ajustado)</small>':''}</button>${pend>0.004?`<button class="bt verde" onclick="abrirPag('${a.id}','${ym}',${pend},'${tp}')">💵 Pagar</button>`:''}</div></div>`};
  return (r2(ta)>0||pagosDe(a.id,ym,'P').length?bloco('Aluguel do mês',ta,'P',taC,ajP):'')+(r2(sa)>0||pagosDe(a.id,ym,'S').length?bloco('Salário do mês',sa,'S',saC,ajS):'')}
function abrirPag(arrId,ym,pend,tp,ed){const sal=tp==='S';const a=arrDe(arrId);const contas=[...new Set(DB.pags.map(p=>p.conta).filter(Boolean))];

/* lança/atualiza sozinho em Despesas o que falta pagar de cada mês (último dia do mês) */
function syncProvisoes(){const ms=DB.movs.map(m=>m.data).filter(Boolean).sort();if(!ms.length)return;const ini=ms[0].slice(0,7)<INI_PAG?INI_PAG:ms[0].slice(0,7),fim=hoje().slice(0,7);
  const quer=new Map();let ym=ini;let g=0;
  while(ym<=fim&&g++<240){const F=calcFatura(ym),[Y,M]=ym.split('-').map(Number),ult=ym+'-'+String(new Date(Y,M,0).getDate()).padStart(2,'0'),rf=ym.slice(5)+'/'+ym.slice(0,4);
    DB.arr.forEach(a=>{const fs=F.filter(x=>x.l.arrId===a.id);if(!fs.length&&!DB.ajus.some(x=>x.arrId===a.id&&x.ref===ym))return;
      ['P','S'].forEach(tp=>{const aj=ajDe(a.id,ym,tp),tot=aj?r2(+aj.valor):r2(fs.reduce((s,x)=>s+(tp==='S'?x.salario:x.valor),0)),pend=r2(tot-somaP(pagosDe(a.id,ym,tp)));
        if(pend>0.004)quer.set(`DV${tp}_${a.id}_${ym}`,{data:ult,tipo:tp==='S'?'SALÁRIO':'ARRENDAMENTO',arrId:a.id,loteId:'',desc:(tp==='S'?'Salário ':'Aluguel ')+rf+' (a pagar)',valor:pend,status:'A PAGAR',ref:rf})})});
    ym=M===12?(Y+1)+'-01':Y+'-'+String(M+1).padStart(2,'0')}
  DB.desp.filter(d=>String(d.id).startsWith('DV')&&!quer.has(d.id)).map(d=>d.id).forEach(id=>del('desp',id));
  quer.forEach((v,id)=>{const o=DB.desp.find(d=>d.id===id);if(!o||o.valor!==v.valor||o.data!==v.data||o.status!==v.status||o.desc!==v.desc)put('desp',{...(o||{}),id,...v})})}
function delPag(id){confirmar('Excluir este pagamento? A despesa lançada junto também será excluída.',()=>{del('pags',id);if(DB.desp.some(d=>d.id==='D'+id))del('desp','D'+id);go(TELA==='despesas'?'despesas':'faturas')})}
function gerarDespesas(ym){
  const F=calcFatura(ym);const [Y,M]=ym.split('-');const ref=M+'/'+Y;let n=0;
  DB.arr.forEach(a=>{const fs=F.filter(x=>x.l.arrId===a.id);fs.forEach(x=>{
    if(x.valor>0&&!DB.desp.some(d=>d.ref===ref&&d.loteId===x.l.id&&d.tipo==='ARRENDAMENTO')){put('desp',{id:nid('D'),data:ym+'-'+String(new Date(Y,M,0).getDate()).padStart(2,'0'),tipo:'ARRENDAMENTO',arrId:a.id,loteId:x.l.id,desc:'Parceria '+ref+' · '+N(x.cd/30)+' cab',valor:Math.round(x.valor*100)/100,status:'A PAGAR',ref});n++}
    if(x.salario>0&&!DB.desp.some(d=>d.ref===ref&&d.loteId===x.l.id&&d.tipo==='SALÁRIO')){put('desp',{id:nid('D'),data:ym+'-'+String(new Date(Y,M,0).getDate()).padStart(2,'0'),tipo:'SALÁRIO',arrId:a.id,loteId:x.l.id,desc:'Salário '+ref,valor:x.salario,status:'A PAGAR',ref});n++}
  })});
  toast(n?n+' despesas lançadas':'Já estavam lançadas');
}

function fzPdf(cvs){const enc=new TextEncoder(),partes=[],offs=[];let tam=0;const add=d=>{const b=typeof d==='string'?enc.encode(d):d;partes.push(b);tam+=b.length};
  const obj=(n,txt,bin)=>{offs[n]=tam;add(`${n} 0 obj\n`+txt);if(bin){add(bin);add('\nendstream')}add('\nendobj\n')};
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');const n=cvs.length,kids=[];
  const imgs=cvs.map(c=>{const u=c.toDataURL('image/jpeg',0.85),b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a});
  const pw=595.28;cvs.forEach((c,i)=>kids.push(3+i*3));
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Count ${n} /Kids [${kids.map(k=>k+' 0 R').join(' ')}] >>`);
  cvs.forEach((c,i)=>{const pg=3+i*3,ct=pg+1,im=pg+2,pwc=c.width>c.height?841.89:pw,ph=(pwc*c.height/c.width).toFixed(2),cmd=`q ${pwc} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(pg,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pwc} ${ph}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    obj(ct,`<< /Length ${cmd.length} >>\nstream\n${cmd}\nendstream`);
    obj(im,`<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgs[i].length} >>\nstream\n`,imgs[i])});
  const tot=3+n*3,xref=tam;let s=`xref\n0 ${tot}\n0000000000 65535 f \n`;for(let i=1;i<tot;i++)s+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(s+`trailer\n<< /Size ${tot} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(partes,{type:'application/pdf'})}
const dataArq=d=>d.slice(8,10)+'-'+d.slice(5,7)+'-'+d.slice(0,4);
/* dados do relatório = o que está filtrado na tela */
function dadosLotes(){const ps=[];DB.arr.filter(a=>a.ativo&&(!FL.loc||a.id===FL.loc)).forEach(a=>{const ls=DB.lotes.filter(l=>l.arrId===a.id&&l.ativo&&(!FL.prop||l.prop===FL.prop));if(!ls.length)return;
  ps.push({a,ls:ls.map(l=>({cat:catLote(l)||sufLote(l)||'sem categoria',prop:l.prop,cab:saldo(l.id),vc:+l.valorCab||0,sal:+l.salario||0,obs:l.obs||''}))})});return ps}
function tituloRel(){const f=[FL.loc?arrDe(FL.loc).nome:'',FL.prop?'Proprietário '+FL.prop:''].filter(Boolean).join(' · ');return {t:'FJK - Parceiros e Lotes - '+fmtD(hoje()),f}}
function linhasRel(ps){const L=[];ps.slice().sort((x,y)=>x.a.nome.localeCompare(y.a.nome,'pt-BR')).forEach(p=>p.ls.forEach(l=>L.push([p.a.nome,p.a.cidade,l.prop,l.cat+(l.obs?' ('+l.obs+')':''),l.cab])));return L}
function imgLotes(ps){const {t,f}=tituloRel();const L=linhasRel(ps),tg=L.reduce((s,r)=>s+r[4],0);const M=30,cols=[['Parceiro',230,'l'],['Cidade',200,'l'],['Proprietário',190,'l'],['Categoria',260,'l'],['Cab.',110,'r']];
  const W=M*2+cols.reduce((a,c)=>a+c[1],0),RH=44,esc2=2;const H=120+(f?30:0)+44+RH*L.length+20+60;
  const cv=document.createElement('canvas');cv.width=W*esc2;cv.height=H*esc2;const c=cv.getContext('2d');c.scale(esc2,esc2);const F='-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  c.fillStyle='#fff';c.fillRect(0,0,W,H);c.fillStyle='#5a3618';c.fillRect(0,0,W,90);c.fillStyle='#a7bc09';c.fillRect(0,90,W,6);
  c.fillStyle='#fff';c.font=`700 32px ${F}`;c.textBaseline='middle';c.fillText(t,M,46);let y=120;
  if(f){c.fillStyle='#5d6b7a';c.font=`600 20px ${F}`;c.fillText('Filtro: '+f,M,y);y+=30}
  const px=(k,al)=>{let x=M;for(let i=0;i<k;i++)x+=cols[i][1];const w=cols[k][1];return al==='l'?x+10:al==='c'?x+w/2:x+w-10};
  c.fillStyle='#f1e8de';c.fillRect(M,y,W-2*M,40);c.font=`700 16px ${F}`;c.fillStyle='#3d2410';
  cols.forEach(([tt,w,al],k)=>{c.textAlign=al==='l'?'left':'right';c.fillText(tt.toUpperCase(),px(k,al),y+20)});y+=44;
  L.forEach((r,i)=>{if(i%2){c.fillStyle='#faf7f3';c.fillRect(M,y,W-2*M,RH)}c.fillStyle='#11253d';
    r.forEach((v,k)=>{const [,w,al]=cols[k];const tx=k===4?N(v):String(v);c.textAlign=al==='l'?'left':'right';let fs=20;const wt=k===0||k===4?700:500;c.font=`${wt} ${fs}px ${F}`;while(c.measureText(tx).width>w-16&&fs>11){fs--;c.font=`${wt} ${fs}px ${F}`}c.fillText(tx,px(k,al),y+RH/2)});
    y+=RH;c.fillStyle='#e4dccf';c.fillRect(M,y-1,W-2*M,1)});y+=20;
  c.fillStyle='#5a3618';c.fillRect(M,y,W-2*M,56);c.fillStyle='#a7bc09';c.fillRect(M,y,W-2*M,4);c.fillStyle='#fff';c.font=`800 24px ${F}`;c.textAlign='left';c.fillText('TOTAL',M+12,y+31);c.textAlign='right';c.fillText(N(tg)+' cab',px(4,'r'),y+31);
  return cv}
function xlsLotes(ps){const H=t=>({v:t,s:1});const rows=[[H('Parceiro'),H('Cidade'),H('Proprietário'),H('Categoria'),H('Cabeças')]];
  const L=linhasRel(ps);L.forEach(r=>rows.push([{v:r[0]},{v:r[1]},{v:r[2]},{v:r[3]},{v:r[4],s:4}]));
  const n=rows.length,tg=L.reduce((s,r)=>s+r[4],0);rows.push([{v:'TOTAL',s:9},{v:'',s:9},{v:'',s:9},{v:'',s:9},{f:`SUM(E2:E${n})`,v:tg,s:7}]);
  return montarXlsx([['Parceiros e Lotes',rows,[20,18,16,22,10]]])}
async function relLotes(tp){const ps=dadosLotes();if(!ps.length)return toast('Nada para gerar com esse filtro');const {f}=tituloRel();const nome='FJK - Parceiros e Lotes - '+dataArq(hoje())+(f?' - '+f:'');
  try{if(tp==='xls')return await salvarOuEnviar([xlsLotes(ps)],[nome+'.xlsx'],XT);const cv=imgLotes(ps);
    if(tp==='pdf')return await salvarOuEnviar([fzPdf([cv])],[nome+'.pdf'],'application/pdf');
    const b=await new Promise(k=>cv.toBlob(k,'image/png'));return await salvarOuEnviar([b],[nome+'.png'],'image/png')}catch(e){toast('Não consegui gerar o arquivo')}}

function abrirArr(){VOLTA=()=>telaLocais();$('#aForm').hidden=false;$('#lForm').hidden=true;$('#llBts').hidden=true;$('#aTit').textContent='Novo parceiro';scrollTo(0,0)}
function editArr(id){abrirArr();const a=arrDe(id);$('#aId').value=id;$('#aN').value=a.nome;$('#aC').value=a.cidade;$('#aAt').value=a.ativo?'1':'0';$('#aTit').textContent='Editar '+a.nome;const b=$('#aInat');b.hidden=false;b.textContent=a.ativo?'Inativar':'Reativar';scrollTo(0,0)}
function inatArr(){const a=arrDe($('#aId').value);if(!a.id)return;
  if(a.ativo){const c=DB.lotes.filter(l=>l.arrId===a.id&&l.ativo).reduce((s,l)=>s+saldo(l.id),0);if(c>0)return toast(a.nome+' ainda tem '+c+' cab — transfira ou dê saída antes');
    confirmar('Inativar o parceiro '+a.nome+'? Os lotes dele também ficam inativos.',()=>{a.ativo=false;put('arr',a);DB.lotes.filter(l=>l.arrId===a.id&&l.ativo).forEach(l=>{l.ativo=false;put('lotes',l)});toast('Parceiro inativado');telaLocais()})}
  else{a.ativo=true;put('arr',a);DB.lotes.filter(l=>l.arrId===a.id&&!l.ativo).forEach(l=>{l.ativo=true;put('lotes',l)});toast('Parceiro e lotes reativados');FL.inat=false;telaLocais()}}
function salvarArr(){const n=$('#aN').value.trim().toUpperCase(),c=$('#aC').value.trim().toUpperCase(),id=$('#aId').value,at=$('#aAt').value==='1';
  if(!n)return toast('Informe o parceiro');
  if(id){const a=arrDe(id);a.nome=n;a.cidade=c;a.ativo=at;put('arr',a)}else put('arr',{id:nid('A'),nome:n,cidade:c,ativo:at});
  toast('Salvo ✓');telaLocais()}

const telaLotes=telaLocais;
function segSel(b){[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b))}
function abrirLote(){VOLTA=()=>telaLocais();$('#lForm').hidden=false;$('#aForm').hidden=true;$('#llBts').hidden=true;$('#lTit').textContent='Novo lote';scrollTo(0,0)}
function editLote(id){abrirLote();const l=loteDe(id);$('#lId').value=id;
  if(![...$('#lA').options].some(o=>o.value===l.arrId))$('#lA').insertAdjacentHTML('beforeend',`<option value="${l.arrId}">${arrDe(l.arrId).nome}</option>`);
  $('#lA').value=l.arrId;$('#lObs').value=l.obs||'';$('#lP').value=l.prop;smv('lV',l.valorCab);smv('lS',l.salario);$('#lCat').value=catLote(l);$('#lAt').value=l.ativo?'1':'0';
  $('#lTit').textContent='Editar '+rotLote(l);const b=$('#lInat');b.hidden=false;b.textContent=l.ativo?'Inativar':'Reativar';scrollTo(0,0)}
function inatLote(){const l=loteDe($('#lId').value);if(!l.id)return;
  if(l.ativo){const c=saldo(l.id);if(c>0)return toast('Lote ainda tem '+c+' cab — transfira ou dê saída antes');confirmar('Inativar o lote '+rotLote(l)+'?',()=>{l.ativo=false;put('lotes',l);toast('Lote inativado');telaLocais()})}
  else{const a=arrDe(l.arrId);if(a.id&&!a.ativo){a.ativo=true;put('arr',a)}l.ativo=true;put('lotes',l);toast('Lote reativado');FL.inat=false;telaLocais()}}
function salvarLote(){const id=$('#lId').value;
  if(!$('#lA').value)return toast('Selecione o parceiro');if(!$('#lCat').value)return toast('Selecione a categoria');if(!$('#lP').value)return toast('Selecione o proprietário');const n=(arrDe($('#lA').value).nome+' - '+$('#lCat').value).toUpperCase();
  const d={arrId:$('#lA').value,nome:n,prop:$('#lP').value,valorCab:mv('lV')||0,salario:mv('lS')||0,categoria:$('#lCat').value,obs:$('#lObs').value.trim(),ativo:$('#lAt').value==='1'};
  if(id){if(!d.ativo&&saldo(id)>0)return toast('Lote ainda tem '+saldo(id)+' cab — transfira ou dê saída antes');put('lotes',Object.assign(loteDe(id),d))}
  else put('lotes',Object.assign({id:nid('L')},d));
  toast('Salvo ✓');telaLocais()}

function gestao(){
  $('#cx').innerHTML=`<div class="card"><h3>Proprietários</h3><div id="gP"></div>
   <div class="row" style="margin-top:8px"><input id="nP" placeholder="Novo proprietário"><button class="bt sm" onclick="addProp()">+ Adicionar</button></div></div>
  <div class="card"><h3>Conexão com a planilha (Google Script)</h3>
   <label>Link do Google Script (/exec)</label><input id="gU" value="${api()}" placeholder="https://script.google.com/macros/s/.../exec">
   <button class="bt sec" onclick="try{localStorage.setItem(LS+'_url',$('#gU').value.trim())}catch(e){};carregar();toast('Link salvo')">Salvar link e sincronizar</button>
   <p class="mut">Pendentes de envio: <b>${FILA.length}</b>${DB.planilha?` · <a href="${DB.planilha}" target="_blank">abrir planilha</a>`:''}</p>
   ${api()&&DB.servidorVazio?'<div class="hint">A planilha está vazia. Envie os parceiros, lotes e saldos iniciais para ela:</div><button class="bt" onclick="enviarTudo();gestao()">Enviar dados iniciais para a planilha</button>':''}
   <button class="bt sec" onclick="carregar();toast('Sincronizando...')">Sincronizar agora</button></div>`;
  $('#gP').innerHTML=DB.props.map(p=>`<div class="list-it"><b>${p}</b><span class="mut">${DB.lotes.filter(l=>l.prop===p&&l.ativo).reduce((s,l)=>s+saldo(l.id),0)} cab</span></div>`).join('');
}
function addProp(){const p=$('#nP').value.trim().toUpperCase();if(!p||DB.props.includes(p))return toast('Informe um nome novo');put('props',{id:p,nome:p});gestao()}
